<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// Ajuste para a URL da sua API rodando via Docker
const API_URL = "http://localhost:5000";
const WGER_EXERCISEINFO_URL = "https://wger.de/api/v2/exerciseinfo/?format=json&language=7&limit=999";

function useDebounce(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return debounced;
}

const CATEGORIAS_PT = {
  Chest: "Peito",
  Back: "Costas",
  Legs: "Pernas",
  Shoulders: "Ombros",
  Arms: "Braços",
  Abs: "Abdômen",
  Calves: "Panturrilhas",
  Cardio: "Cardio",
};

function BuscaExercicios({ onAdicionar }) {
  const [termo, setTermo] = useState("");
  const [categoria, setCategoria] = useState("Todas");
  const [catalogo, setCatalogo] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);
  const termoDebounced = useDebounce(termo, 300);

  useEffect(() => {
    fetch(WGER_EXERCISEINFO_URL)
      .then((r) => r.json())
      .then((data) => {
        const lista = (data.results || []).flatMap((ex) =>
          (ex.translations || [])
            .filter((t) => t.language === 7 && t.name)
            .map((t) => ({
              id: ex.id,
              nome: t.name,
              categoria: CATEGORIAS_PT[ex.category?.name] || ex.category?.name || "Outros",
            }))
        );
        const extras = [
          { id: -1, nome: "Corrida (esteira/interna)", categoria: "Cardio" },
          { id: -2, nome: "Corrida ao ar livre", categoria: "Cardio" },
        ];
        setCatalogo([...lista, ...extras]);
      })
      .catch(() => setErro(true))
      .finally(() => setCarregando(false));
  }, []);

  const categoriasDisponiveis = [
    "Todas",
    ...new Set(catalogo.map((ex) => ex.categoria)),
  ];

  const resultados = catalogo
    .filter((ex) => categoria === "Todas" || ex.categoria === categoria)
    .filter((ex) => termoDebounced.length < 2 || ex.nome.toLowerCase().includes(termoDebounced.toLowerCase()))
    .slice(0, 15);

  const mostrarResultados = termoDebounced.length >= 2 || categoria !== "Todas";

  return (
    <div className="card">
      <label>Buscar exercício</label>
      <div className="row" style={{ marginTop: 6 }}>
        <input
          style={{ flex: 1 }}
          placeholder={carregando ? "Carregando catálogo..." : "ex.: supino, agachamento, remada..."}
          value={termo}
          onChange={(e) => setTermo(e.target.value)}
          disabled={carregando}
        />
        <select value={categoria} onChange={(e) => setCategoria(e.target.value)} disabled={carregando}>
          {categoriasDisponiveis.map((c) => (
            <option key={c} value={c}>
              {c === "Todas" ? "Todas as partes do corpo" : c}
            </option>
          ))}
        </select>
      </div>
      {erro && <p className="muted">Não consegui carregar o catálogo da wger.de agora.</p>}
      {mostrarResultados &&
        resultados.map((r) => (
          <div className="search-result" key={r.id}>
            <span>
              {r.nome} <span className="muted">({r.categoria})</span>
            </span>
            <button
              className="secondary"
              onClick={() =>
                onAdicionar({
                  exercicio_wger_id: r.id,
                  nome_exercicio: r.nome,
                  series: 3,
                  repeticoes: 10,
                  carga_kg: 0,
                })
              }
            >
              Adicionar
            </button>
          </div>
        ))}
      {mostrarResultados && !carregando && resultados.length === 0 && (
        <p className="muted">Nenhum resultado.</p>
      )}
    </div>
  );
}

function FormularioTreino({ treinoEmEdicao, onSalvo, onCancelarEdicao }) {
  const [data, setData] = useState(() => new Date().toISOString().slice(0, 10));
  const [observacao, setObservacao] = useState("");
  const [exercicios, setExercicios] = useState([]);

  useEffect(() => {
    if (treinoEmEdicao) {
      setData(treinoEmEdicao.data);
      setObservacao(treinoEmEdicao.observacao || "");
      setExercicios(treinoEmEdicao.exercicios || []);
    }
  }, [treinoEmEdicao]);

  const adicionarExercicio = (ex) => setExercicios((prev) => [...prev, ex]);
  const removerExercicio = (idx) => setExercicios((prev) => prev.filter((_, i) => i !== idx));
  const atualizarCampo = (idx, campo, valor) =>
    setExercicios((prev) => prev.map((e, i) => (i === idx ? { ...e, [campo]: valor } : e)));

  const limpar = () => {
    setData(new Date().toISOString().slice(0, 10));
    setObservacao("");
    setExercicios([]);
    onCancelarEdicao && onCancelarEdicao();
  };

  const salvar = async () => {
    if (exercicios.length === 0) {
      alert("Adicione pelo menos um exercício.");
      return;
    }
    const payload = { data, observacao, exercicios };
    const editando = Boolean(treinoEmEdicao);
    const url = editando ? `${API_URL}/treinos/${treinoEmEdicao.id}` : `${API_URL}/treinos`;
    const method = editando ? "PUT" : "POST";

    try {
      const resp = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!resp.ok) throw new Error(`status ${resp.status}`);
    } catch (err) {
      alert("Não consegui salvar o treino. Confira se a API (backend) está rodando em " + API_URL);
      return;
    }

    limpar();
    onSalvo();
  };

  return (
    <div className="card">
      <h2 style={{ marginTop: 0 }}>{treinoEmEdicao ? `Editando treino #${treinoEmEdicao.id}` : "Novo treino"}</h2>
      <div className="row">
        <div>
          <label className="muted">Data</label>
          <br />
          <input type="date" value={data} onChange={(e) => setData(e.target.value)} />
        </div>
        <div style={{ flex: 1 }}>
          <label className="muted">Observação</label>
          <br />
          <input
            style={{ width: "100%" }}
            value={observacao}
            onChange={(e) => setObservacao(e.target.value)}
            placeholder="opcional"
          />
        </div>
      </div>

      <BuscaExercicios onAdicionar={adicionarExercicio} />

      {exercicios.map((ex, idx) => (
        <div className="ex-item" key={idx}>
          <span>{ex.nome_exercicio}</span>
          <span>
            <input
              type="number"
              value={ex.series}
              onChange={(e) => atualizarCampo(idx, "series", Number(e.target.value))}
            />{" "}
            séries ×{" "}
            <input
              type="number"
              value={ex.repeticoes}
              onChange={(e) => atualizarCampo(idx, "repeticoes", Number(e.target.value))}
            />{" "}
            reps ×{" "}
            <input
              type="number"
              value={ex.carga_kg}
              onChange={(e) => atualizarCampo(idx, "carga_kg", Number(e.target.value))}
            />{" "}
            kg
          </span>
          <button className="danger" onClick={() => removerExercicio(idx)}>
            Remover
          </button>
        </div>
      ))}

      <div className="row" style={{ marginTop: 14 }}>
        <button onClick={salvar}>{treinoEmEdicao ? "Salvar edição" : "Registrar treino"}</button>
        {treinoEmEdicao && (
          <button className="secondary" onClick={limpar}>
            Cancelar edição
          </button>
        )}
      </div>
    </div>
  );
}

function GraficoProgresso({ recarregarSinal }) {
  const [treinos, setTreinos] = useState([]);
  const [exercicioSelecionado, setExercicioSelecionado] = useState("");
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  useEffect(() => {
    fetch(`${API_URL}/treinos?per_page=1000`)
      .then((r) => r.json())
      .then((d) => setTreinos(d.treinos || []))
      .catch(() => setTreinos([]));
  }, [recarregarSinal]);

  const nomesExercicios = [
    ...new Set(
      treinos.flatMap((t) => t.exercicios.map((e) => e.nome_exercicio))
    ),
  ];

  useEffect(() => {
    if (!exercicioSelecionado && nomesExercicios.length > 0) {
      setExercicioSelecionado(nomesExercicios[0]);
    }
  }, [nomesExercicios]);

  useEffect(() => {
    if (!canvasRef.current || !exercicioSelecionado) return;

    const pontos = treinos
      .flatMap((t) =>
        t.exercicios
          .filter((e) => e.nome_exercicio === exercicioSelecionado)
          .map((e) => ({ data: t.data, carga: e.carga_kg }))
      )
      .sort((a, b) => a.data.localeCompare(b.data));

    if (chartRef.current) chartRef.current.destroy();

    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: {
        labels: pontos.map((p) => p.data),
        datasets: [
          {
            label: `${exercicioSelecionado} (kg)`,
            data: pontos.map((p) => p.carga),
            borderColor: "#2bb0af",
            backgroundColor: "rgba(43,176,175,0.18)",
            tension: 0.25,
            fill: true,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: "#d9f5f4" } } },
        scales: {
          x: { ticks: { color: "#6fb3b1" }, grid: { color: "#1c5f5d" } },
          y: { ticks: { color: "#6fb3b1" }, grid: { color: "#1c5f5d" } },
        },
      },
    });

    return () => chartRef.current && chartRef.current.destroy();
  }, [exercicioSelecionado, treinos]);

  if (nomesExercicios.length === 0) {
    return null;
  }

  return (
    <div className="card">
      <h2 style={{ marginTop: 0 }}>Evolução de carga</h2>
      <select
        value={exercicioSelecionado}
        onChange={(e) => setExercicioSelecionado(e.target.value)}
      >
        {nomesExercicios.map((nome) => (
          <option key={nome} value={nome}>
            {nome}
          </option>
        ))}
      </select>
      <canvas ref={canvasRef} style={{ marginTop: 12, maxHeight: 300 }}></canvas>
    </div>
  );
}

function ListaTreinos({ onEditar, recarregarSinal }) {
  const [treinos, setTreinos] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [filtroData, setFiltroData] = useState("");
  const perPage = 5;

  const carregar = useCallback(() => {
    const params = new URLSearchParams({ page, per_page: perPage });
    if (filtroData) params.set("data", filtroData);
    fetch(`${API_URL}/treinos?${params}`)
      .then((r) => r.json())
      .then((d) => {
        setTreinos(d.treinos || []);
        setTotal(d.total || 0);
      })
      .catch(() => {});
  }, [page, filtroData]);

  useEffect(() => {
    carregar();
  }, [carregar, recarregarSinal]);

  const excluir = async (id) => {
    if (!confirm("Remover este treino?")) return;
    try {
      const resp = await fetch(`${API_URL}/treinos/${id}`, { method: "DELETE" });
      if (!resp.ok) throw new Error(`status ${resp.status}`);
    } catch (err) {
      alert("Não consegui excluir. Confira se a API (backend) está rodando em " + API_URL);
      return;
    }
    carregar();
  };

  const totalPaginas = Math.max(1, Math.ceil(total / perPage));

  return (
    <div className="card">
      <h2 style={{ marginTop: 0 }}>Treinos registrados</h2>
      <div className="row">
        <input
          type="date"
          value={filtroData}
          onChange={(e) => {
            setFiltroData(e.target.value);
            setPage(1);
          }}
        />
        {filtroData && (
          <button className="secondary" onClick={() => setFiltroData("")}>
            Limpar filtro
          </button>
        )}
      </div>

      {treinos.length === 0 && <p className="muted">Nenhum treino encontrado.</p>}

      {treinos.map((t) => (
        <div key={t.id} className="card" style={{ background: "#103d3c" }}>
          <div className="row" style={{ justifyContent: "space-between" }}>
            <strong>{t.data}</strong>
            <span>
              <button className="secondary" onClick={() => onEditar(t)}>
                Editar
              </button>{" "}
              <button className="danger" onClick={() => excluir(t.id)}>
                Excluir
              </button>
            </span>
          </div>
          {t.observacao && <p className="muted">{t.observacao}</p>}
          {t.exercicios.map((ex) => (
            <div key={ex.id} className="muted">
              {ex.nome_exercicio} ({ex.series}x{ex.repeticoes}, {ex.carga_kg} kg)
            </div>
          ))}
        </div>
      ))}

      <div className="pagination">
        <button className="secondary" disabled={page <= 1} onClick={() => setPage((p) => p - 1)}>
          Anterior
        </button>
        <span className="muted">
          Página {page} de {totalPaginas}
        </span>
        <button className="secondary" disabled={page >= totalPaginas} onClick={() => setPage((p) => p + 1)}>
          Próxima
        </button>
      </div>
    </div>
  );
}
